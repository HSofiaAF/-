name: Deploy Firebase Rules

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  deploy-rules:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate Firebase secrets
        id: secrets-check
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase rules deploy skipped: missing FIREBASE_TOKEN or FIREBASE_PROJECT_ID/VITE_FIREBASE_PROJECT_ID secret."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore and Storage rules
        if: steps.secrets-check.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --only firestore:rules,storage

      - name: Secrets missing notice
        if: steps.secrets-check.outputs.ready != 'true'
        run: echo "No se desplegaron reglas de Firebase porque faltan secretos."
