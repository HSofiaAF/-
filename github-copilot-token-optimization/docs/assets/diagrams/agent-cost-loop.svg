<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="54" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#14213d">Agent mode cost loop</text>
<text x="54" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#526171">Every tool step replays more context than the previous one.</text>
<path d="M 460 265 L 515 265 L 515 215 L 560 215" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow_2563eb)"/>
<path d="M 880 215 L 935 215 L 935 265 L 980 265" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow_0f766e)"/>
<path d="M 1145 325 L 1280 325 L 1280 565 L 1105 565" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow_7c3aed)"/>
<path d="M 770 565 L 670 565" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow_d97706)"/>
<path d="M 350 545 L 120 545 L 120 285 L 150 285" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow_dc2626)"/>
<rect x="150" y="205" width="310" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="305.0" y="247.6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">1. Load context</text>
<text x="305.0" y="273.2" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">system + instructions</text>
<text x="305.0" y="298.8" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">+ tools + history</text>
<rect x="570" y="155" width="310" height="120" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
<text x="725.0" y="210.4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">2. Model decides</text>
<text x="725.0" y="236.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">which tool to call</text>
<rect x="990" y="205" width="310" height="120" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1145.0" y="260.4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">3. Tool result</text>
<text x="1145.0" y="286.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">becomes next input</text>
<rect x="780" y="500" width="310" height="125" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="935.0" y="545.1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">4. Replay all prior</text>
<text x="935.0" y="570.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">context + result +</text>
<text x="935.0" y="596.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">history</text>
<rect x="350" y="500" width="310" height="125" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="505.0" y="545.1" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">5. Repeat</text>
<text x="505.0" y="570.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">5-25 times if task is</text>
<text x="505.0" y="596.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#14213d">broad</text>
<text x="725.0" y="738.7" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#14213d">Avoided step = one full context reload saved.</text>
</svg>